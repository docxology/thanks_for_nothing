schema: thanks_for_nothing.captions.v1
captions:
  - figure: "gnn_model_graph"
    title: "Graph structure comes from the executed GNN declarations."
    task: "The graph exposes the admitted StateSpaceBlock variables and Connections edges."
    reading: "Only declarations with identical parsed nodes and edges share a panel. Complete executable instances expose known-query and latent-basis variables as well as their joint state. Arrows retain the declared direction; native per-model GNN renders and topology statistics accompany the publication view."
    uncertainty: "This is a declaration dependency graph, not an estimated causal DAG or an uncertainty interval. The state–transition cycle is not an instantaneous causal claim."
    scope: "A common graph syntax does not imply common psychological meaning, action selection or numerical execution. The tensor and consumer inventory distinguishes those roles."
  - figure: "gnn_model_tensors"
    title: "Complete runtime GNN families expose the full declared state space."
    task: "Each row binds a complete executable family to admitted dimensions and numerical evidence. Instances share a row only when family and dimensions agree; their parameter values can differ. The front-matter model card separately lists the authoring inputs, including native attention models and the analysis carrier."
    reading: "A is observation by state; B is next state by previous state by action; C contains observation preferences; D is the state prior. R denotes restricted prior support. Dimensions and instance counts are injected from admitted tensors and the execution catalog."
    uncertainty: "Shapes describe finite model structure, not sample size or empirical uncertainty. These local finite consumers use GNN-admitted arrays; native GNN/pymdp execution is separately recorded for attention."
    scope: "The generic GNN backend label does not establish that a native policy executor ran every experiment. Passive preferences and neutral protocol tensors do not acquire a scientific role from appearing in the graph."
  - figure: "world_traditions"
    title: "Distinct textual responses to absence and relinquishment."
    task: "Selected named textual witnesses are aligned by what is absent or relinquished and what appreciation or response follows."
    reading: "Read each row from the named witness and passage locator to the two interpretive summaries. Alternating shading guides row tracking and encodes no grouping or rank. Separate Buddhist and Christian rows retain different textual settings; the source companion gives translators, links, addressees, practices and limits."
    uncertainty: "This is an editorially selected qualitative comparison, with no sampled estimates, shared scale, ranking or confidence intervals."
    scope: "Gratitude is not explicit in every passage. These witnesses neither exhaust their traditions nor establish doctrinal equivalence, historical influence or validation of the finite computational model."
  - figure: "concept_map"
    title: "Different questions require different meanings of nothing."
    task: "The {{CONCEPT_COUNT}} panels distinguish evidence, availability, reference-dependent value and the status of a representation."
    reading: "{{CONCEPT_A_LABEL}} records $o=0$ through a functioning detector; {{CONCEPT_B_LABEL}} has no observation; {{CONCEPT_C_LABEL}} compares expected reference harm with actual cost. {{CONCEPT_D_LABEL}} redraws a self/world boundary while preserving useful dependencies."
    uncertainty: "These are symbolic operations, with no sampled estimates or confidence intervals."
    scope: "Realizing Emptiness motivates examining assumed necessity; the diagram supplies neither a realization score nor evidence that appreciation causes inquiry."
  - figure: "experiment_overview"
    title: "What each experiment changes, scores and can rule out."
    task: "Read each row from its question through the controlled comparison to its assessment and decisive limitation."
    reading: "Recall, absence/value, enacted inquiry, learned gaze transfer, active scene sampling and joint scene/encoding inquiry are separate experiments. Budgets and independent-unit descriptions come from the admitted designs; a new observation, a replayed event and a structural question have different roles."
    uncertainty: "This is a design map, not an effect-size display; the main Results and complete supplementary tables report the estimates and uncertainty."
    scope: "The comparison column identifies software controls that constrain interpretation. No row measures human gratitude, eye movements or contemplative realization."
  - figure: "task_settings"
    title: "Concrete settings behind the experimental comparisons."
    task: "The panels introduce paired recall, a detector with an absent or unavailable record, costly access to predictive alternatives, and discrete scene sampling."
    reading: "Training and replay durations, assessment sizes, costs, locations and decision budgets are generated from the executed records. In the scene, circles, triangles and squares identify positive, negative and neutral registered sites; R and O denote restricted and open candidate families."
    uncertainty: "The timelines and icons describe the protocol and carry no inferential intervals."
    scope: "The scene is a schematic registration; its pixels do not generate observations. Counterfactual value does not update beliefs, and activity does not guarantee access."
  - figure: "recall_situation"
    title: "Selective replay changes a readout without guaranteeing better prediction."
    task: "Shared environmental exposure is held fixed within each paired unit; positive and random replay have matched doses, and frozen models face separate new tests."
    reading: "Panel a shows exposure, replay and independent assessment. Panels b (optimism) and c (Brier loss) show positive recall minus no recall (circles, solid) or matched random recall (squares, dashed) at each fixed world probability. Zero denotes no paired contrast. Both vertical axes multiply native differences by {{DISPLAY_SCALE}}; their scales differ."
    uncertainty: "Whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over {{STUDY_REPLICATES}} independent paired units per world; connections guide comparison across the fixed grid."
    scope: "Negative Brier differences favor positive recall; an optimism change is not a well-being effect. World-specific intervals are exploratory; pooled tests and every interval method remain supplementary."
  - figure: "practice_situation"
    title: "Access, rather than activity alone, permits evidence-responsive revision."
    task: "The agent values an opportunity to examine a working family, chooses costly activity, may gain access, and selects a predictor before seeing new assessment outcomes."
    reading: "Panel a identifies these stages. Panel b compares reversal-process probabilities with frozen mean forecasts; panel c shows each policy's held-out log loss minus rigid prediction, with zero denoting equal loss. Sham and blocked access preserve rigid forecasts while charging activity costs."
    uncertainty: "Loss whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over {{PRACTICE_REPLICATES}} independent paired replicate averages, each averaging {{PRACTICE_WINDOWS}} windows. Forecast curves are descriptive means."
    scope: "Negative log-loss differences favor the policy, in nats per outcome; costs are separate. The model can retain a useful restriction, and no stage measures realization."
  - figure: "gaze_situation"
    title: "Looking differently and predicting better are separate tests."
    task: "An agent samples declared scene sites and updates a finite belief; learned-likelihood transfer and active inquiry are evaluated as distinct experiments."
    reading: "Panel a shows the sites and sampling loop. Panel b uses the likelihood bridge to compare positive-site policy changes with no recall, in percentage points. Panel c shows open-inquiry log loss minus already-open utility or uniform sampling, in nats per outcome; negative values favor inquiry. The panels have different endpoints and scales."
    uncertainty: "Transfer whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over complete paired agents. Active-scene circles show analytic bounds; diamonds use the full exploratory {{GAZE_CONTRASTS}}-contrast joint rectangle over complete replicate averages."
    scope: "The dashed bridge is an alternative readout projection. Intervals spanning zero do not establish an inquiry-specific advantage, and registered model sites are not measured eye tracking."
  - figure: "boundary_situation"
    title: "Learning an encoding is different from using it for reference prediction."
    task: "Spatial observations and paired randomized-action responses update a joint belief over scene and encoding under one {{BOUNDARY_STEPS}}-decision budget."
    reading: "Panel a separates evidence routes and targets. Panels b and c show policy-minus-visual-only differences for the preselected {{MODEL_BOUNDARY_EXCLUDED_ENCODINGS}} case: anchored excess log loss and encoding Brier loss, respectively. Zero denotes equal loss; the endpoints have separate scales."
    uncertainty: "Bounds come from the complete {{BOUNDARY_CONTRASTS}}-member exploratory family, with {{BOUNDARY_REPLICATES}} independent paired replicates per fixed scene stratum. Circles are stochastic estimates, squares proved constants and crosses unavailable intervals."
    scope: "Negative differences favor the named policy. Encoding improvement alone does not establish reference transfer; adverse restricted-policy offsets and exact sham values remain visible."
  - figure: "concept_operations"
    title: "From each meaning of nothing to its implemented operation."
    task: "The rows connect the shared vocabulary to distinct inputs, model operations and assessment targets."
    reading: "{{CONCEPT_A_LABEL}} and {{CONCEPT_B_LABEL}} show posterior probabilities and KL information in bits. {{CONCEPT_C_LABEL}} places the fixture's reference value in cost units beside the corrected study's maximum paired belief difference. {{CONCEPT_D_LABEL}} links costly access to independent prediction."
    uncertainty: "These are exact fixture readouts or declared settings, with no sampling intervals; values in different units are not a common effect size."
    scope: "The first rows test numerical semantics. The non-reification row is a finite enabling counterpart to Realizing Emptiness, rather than a realization score."
  - figure: "boundary_task"
    title: "Two evidence routes answer different questions about the same scene."
    task: "Scene content Z and encoding H jointly determine appearance W; an encoding question returns a randomized action and its conditional response."
    reading: "The middle probe uses reliability {{BOUNDARY_MIDDLE_RELIABILITY}}. Spatial samples and {{BOUNDARY_PROBES}} question types share {{BOUNDARY_STEPS}} decisions. Separate scores assess the encoding and prediction under the declared H={{BOUNDARY_ANCHOR_MAPPING}} reference intervention."
    uncertainty: "All boxes describe an admitted protocol, not an estimated effect; arrows denote data dependencies."
    scope: "Neither evidence route alone identifies the full reference target in the diagnostic setting. The pinned Realizing Emptiness mathematical fixtures are separate checks, not extra observations or participants."
  - figure: "practice_mechanism"
    title: "A proposed human motivation and an executed software mechanism."
    task: "The diagram asks which links are needed for appreciating examinability to support useful inquiry."
    reading: "Solid arrows connect declared value, costly activity, effective access, evidence-based retention or revision, and prediction on new outcomes. Named software controls and prospective behavioral rivals identify ways these links can fail."
    uncertainty: "The dashed appreciation-to-preference link is an unmeasured proposal; the diagram contains no effect estimates or confidence intervals."
    scope: "Future access remains possible after a working-family choice. Activity, an open menu and a favorable score are each insufficient as a measure of realization."
  - figure: "exact_decision"
    title: "Exhaustive selection exposes both useful and rare adverse decisions."
    task: "Every possible channel-zero calibration count is evaluated under the same admitted restricted and open families."
    reading: "Panel A shows log Bayes factors: circles select open and squares retain restricted, with zero marking equal evidence. Panels B and C show the same count probabilities on linear and logarithmic scales. Dotted vertical boundaries mark a change in the selected family between adjacent counts. The log view exposes nonzero tails that visually merge with zero in the linear view."
    uncertainty: "Count masses are exact finite binomial probabilities evaluated numerically; they are distributions, not confidence bands, posterior family probabilities or repeated-policy activity rates. Connecting segments guide the eye between discrete counts."
    scope: "This conditional one-window oracle is independent of the seeded trajectory sample and does not establish that unrestricted prediction is universally better."
  - figure: "practice_revision"
    title: "Conditional revision must face new observations."
    task: "Policies choose and fit a working family from calibration evidence before assessment."
    reading: "The forecast panel compares process probabilities with mean frozen forecasts in reversal windows. Sham and no-access forecasts equal rigid forecasts exactly and are not overplotted. The comparison panel shows policy-minus-rigid held-out log loss."
    uncertainty: "Whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over independent paired replicate averages; curves are descriptive window means."
    scope: "Negative differences favor the policy in nats per outcome. Inquiry costs are retained separately, and forecast overlap is a mechanism identity rather than missing data."
  - figure: "practice_policies"
    title: "Choosing an activity does not guarantee access to alternatives."
    task: "Matched policy conditions separate declared motivation, chosen activity, effective access and expenditure."
    reading: "Within each pair, the solid gray bar on the left shows the fraction of windows with chosen activity; the hatched teal bar on the right shows effective access. Labels give means to two significant digits; a visible zero marks no access. Each context uses {{PRACTICE_REPLICATES}} independent paired replicates and {{PRACTICE_WINDOWS}} repeated windows."
    uncertainty: "Bars are descriptive finite means without inferential whiskers; windows are not additional independent agents."
    scope: "Sham and blocked access can incur activity costs while providing no access. These rates describe software choices, not human adherence or insight."
  - figure: "paired_contrasts"
    title: "Complete primary recall contrasts on the fixed world grid."
    task: "Each target is an equally weighted mean of paired post-minus-pre changes across the declared worlds."
    reading: "Circles show percentile intervals and diamonds studentized bootstrap intervals; horizontal values are multiplied by {{DISPLAY_SCALE}}. Negative Brier contrasts favor the first condition, while the optimism readout has a separate interpretation."
    uncertainty: "Both interval types are pointwise {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over complete agents within fixed strata. The exact absence-value null has no studentized interval because variance is zero."
    scope: "Interval overlap does not encode the primary Holm decision; sign-flip assumptions and Monte Carlo qualification remain separate."
  - figure: "learning_trajectories"
    title: "Ensemble means and paired changes answer different trajectory questions."
    task: "The extreme admitted worlds retain all {{STUDY_REPLICATES}} independent paired agents per world."
    reading: "Upper panels show mean daily beliefs; lower panels subtract each agent's no-recall trajectory before averaging and multiply differences by {{DISPLAY_SCALE}}. Markers identify conditions, and the vertical line starts rehearsal."
    uncertainty: "Shaded bands are between-agent interquartile ranges, including ranges of paired changes below; they are not confidence intervals. Days and decisions repeat within agents."
    scope: "Shared baselines produce exact paired zeros before rehearsal. Independent predictive assessments, rather than a smooth belief trajectory, evaluate predictive consequences."
  - figure: "sampling_precision"
    title: "More independent units improve numerical precision within a fixed model."
    task: "Rows compare positive-minus-random recall Brier change, reversal inquiry-minus-rigid practice loss, reversal inquiry-minus-open-utility gaze loss, and integrated-minus-visual anchored loss for the final declared encoding."
    reading: "Left panels give equal-stratum paired means with one-MCSE whiskers and a dotted full-budget reference. Right panels show the Monte Carlo standard error and an inverse-square-root guide anchored at the full budget. Each row retains its own native units."
    uncertainty: "Prefixes retain whole independent paired units within fixed strata; repeated practice and gaze windows are averaged first. Prefixes share earlier units and are correlated. One-MCSE whiskers do not claim nominal confidence coverage, and the scaling guide is not a guaranteed error rate."
    scope: "Stabilization and larger samples do not validate the generating model, repair observation equivalence or establish human efficacy. An empirical constant is not automatically a mechanism identity."
  - figure: "calibration_by_world"
    title: "Predictive loss depends on the world being modeled."
    task: "The display separates absolute post-learning Brier performance from paired changes caused by replay."
    reading: "The absolute-loss panel shows means and between-unit interquartile ranges; the contrast panel compares positive recall with its named references at each fixed world probability."
    uncertainty: "Contrast whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over {{STUDY_REPLICATES}} independent paired units per world; interquartile ranges describe spread and are not confidence intervals."
    scope: "Brier is a loss, so negative contrast values favor positive recall. These exploratory world comparisons do not establish subgroup significance or isolate calibration from other score components."
  - figure: "paired_spread"
    title: "A mean effect can conceal variation between paired agents."
    task: "The display examines the distribution of predictive-loss differences within each fixed world."
    reading: "Circles and squares mark medians for the named positive-recall comparisons; horizontal segments show the interquartile range of complete paired units. The vertical axis is quantitative world probability."
    uncertainty: "The segments are distribution summaries, not confidence intervals; repeated decisions do not enlarge the sample."
    scope: "Negative loss differences favor positive recall. These exploratory spreads complement, rather than replace, the equally weighted primary target."
  - figure: "weighting_sensitivity"
    title: "Changing world weights changes the estimand."
    task: "The analysis reweights the same estimated world means without generating new agents."
    reading: "Gray segments span all convex world mixtures, orange segments span leave-one-world-out estimates, and diamonds mark equal weighting. Horizontal values use the multiplier {{DISPLAY_SCALE}}."
    uncertainty: "These are ranges conditional on fixed estimated means, with no sampling-confidence interpretation."
    scope: "A different population mixture can change the aggregate conclusion. The ranges quantify that dependence rather than adding independent evidence."
  - figure: "absence_information"
    title: "A recorded absence can inform; an unavailable record need not."
    task: "The fixture compares the same hazard prior under a functioning detector's no-event result and the declared missing-observation rule."
    reading: "Bars show state probabilities; annotations report KL information in bits for {{CONCEPT_A_LABEL}} and {{CONCEPT_B_LABEL}}."
    uncertainty: "These are exact admitted finite calculations with no sampling intervals."
    scope: "The no-update missingness rule is stipulated. This control distinguishes informational semantics and does not measure gratitude or contemplative insight."
  - figure: "appreciation_null"
    title: "Counterfactual value can change without new belief evidence."
    task: "{{CONCEPT_C_LABEL}} evaluates an outcome against a specified alternative while preserving the no-recall inference path."
    reading: "The value panel shows valuation means and between-unit interquartile ranges. The equality panel reports maximum paired differences in belief, Brier loss and observation log loss."
    uncertainty: "Interquartile ranges describe unit spread; the paired maxima are exact numerical control quantities rather than estimated confidence bounds."
    scope: "Equality is imposed by the valuation mechanism. It is a semantic null, not empirical evidence that human appreciation is independent of belief."
  - figure: "yarbus_reconstruction"
    title: "The preserved notebook reproduces source-before occupancy only."
    task: "The same seed {{GAZE_SOURCE_SEED}} and alternating run order drive the source adapter for {{GAZE_SOURCE_RUNS}} runs."
    reading: "Paths show the first {{GAZE_TRAJECTORY_STEPS}} locations of the first positive and negative runs; occupancy summaries use every source run. Lines connect discrete registered model sites."
    uncertainty: "Paths are illustrative and occupancy summaries descriptive; no executable source-after intervention or uncertainty interval is supplied."
    scope: "This is a new full-frame registration, not recovered eye tracking. Artwork: {{ARTWORK_CREDIT}}; rescaled with model overlays."
  - figure: "gaze_transfer_paths"
    title: "A learned channel is transferred through an explicit bridge."
    task: "Frozen pre/post likelihoods from the same paired agent drive a distinct scene-sampling task."
    reading: "The positive-recall examples at world settings {{GAZE_EXAMPLE_STRATA}} show the first {{GAZE_TRAJECTORY_STEPS}} of {{GAZE_TRANSFER_STEPS}} states. The process, preferences and action uniforms remain paired."
    uncertainty: "These first-agent paths are illustrations without inferential intervals."
    scope: "The display uses the likelihood embedding, not the alternative readout projection or unavailable source-after code. Artwork: {{ARTWORK_CREDIT}}; rescaled with registered model overlays."
  - figure: "gaze_transfer_summary"
    title: "An attention shift can coexist with worse prediction."
    task: "The likelihood bridge transports actual frozen learned channels into a separate scene task."
    reading: "The upper panels show descriptive pre/post positive-site policy changes by world. The lower panels show equally weighted paired differences from no recall, keeping attention and scene-loss units separate."
    uncertainty: "Whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over complete paired agents. Exact nulls have zero-width analytic intervals and unavailable bootstrap t intervals."
    scope: "More positive-location policy mass is not necessarily better prediction. The full tables preserve both bridges and every contrast."
  - figure: "gaze_inquiry_paths"
    title: "Access and policy are distinct in active scene sampling."
    task: "Restricted utility and open inquiry see matched potential observations in stationary and reversal contexts."
    reading: "Each panel shows {{GAZE_TRAJECTORY_STEPS}} samples from the first paired replicate and declared example window. The background image stays fixed while the supplied regional likelihood changes."
    uncertainty: "These paths illustrate model decisions without uncertainty bands; the prior resets for each episode."
    scope: "A different scanpath does not identify a contemplative mechanism. Artwork: {{ARTWORK_CREDIT}}; the registration and overlays are authored displays."
  - figure: "gaze_inquiry_summary"
    title: "Predictive benefit and movement cost require separate comparisons."
    task: "Open and restricted policies share a decision budget and complete paired potential outcomes."
    reading: "Estimates compare each policy's {{GAZE_WINDOWS}}-window average with restricted utility. Prediction and movement are separate endpoints; uniform open sampling is a same-budget comparator."
    uncertainty: "Whiskers are pointwise analytic {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over independent complete replicate averages; proved constant contrasts have zero width."
    scope: "Open access can help reversal prediction while incurring stationary costs. An inquiry-specific claim additionally requires direct comparison with already-open utility and uniform sampling, retained in the complete tables."
  - figure: "gaze_joint_uncertainty"
    title: "Selected gaze differences retain their full-family uncertainty."
    task: "The display compares likelihood transfer, readout projection, and inquiry against already-open comparators without pooling those mechanisms."
    reading: "Gray circles show pointwise analytic t bounds; teal diamonds use the single exploratory {{GAZE_CONTRASTS}}-contrast standardized bootstrap rectangle; purple squares retain mechanism-exact valuation zeros. Each panel uses its native loss scale."
    uncertainty: "The joint region resamples complete paired vectors within fixed independent blocks; its nominal level is {{JOINT_CONFIDENCE_PERCENT}}%."
    scope: "The selected display does not shrink the tested family. Bounds neither establish an extra inquiry-specific benefit nor guarantee finite-sample coverage."
  - figure: "joint_coverage"
    title: "Nominal family confidence needs known-answer checks."
    task: "Each independent repetition generates a family whose true contrasts are all zero; successful coverage must include every target."
    reading: "Circles apply unadjusted analytic t intervals and diamonds the joint bootstrap rectangle. A separate panel records complete-region availability."
    uncertainty: "Whiskers are exact binomial {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over independent experiments. Unavailable regions count as noncoverage; the nominal {{JOINT_CONFIDENCE_PERCENT}}% line is a reference, not a tuned acceptance rule."
    scope: "Skew-related undercoverage and unavailable rare-event families remain findings. This is statistical software calibration, not empirical power for gratitude."
  - figure: "boundary_gaze_outcomes"
    title: "Encoding recovery and reference transfer can diverge."
    task: "Diagnostic-regime policies are compared with visual-only sampling for each true encoding: {{BOUNDARY_ENCODING_LABELS}}."
    reading: "Columns separate anchored excess log loss from encoding Brier loss. Negative values favor the named policy; squares mark proved constants and crosses unavailable intervals."
    uncertainty: "Bounds use the global {{BOUNDARY_CONTRASTS}}-member exploratory bootstrap maximum, including label-only contrasts. Independent paired replicates are resampled within fixed scene strata."
    scope: "The restricted prior excludes {{MODEL_BOUNDARY_EXCLUDED_ENCODINGS}}. Better encoding Brier loss alone does not establish useful reference prediction."
  - figure: "boundary_information"
    title: "The action-response relation can identify what its marginals cannot."
    task: "The matrices display declared response probabilities conditional on the randomized action, using the middle probe at reliability {{BOUNDARY_MIDDLE_RELIABILITY}}."
    reading: "The diagnostic columns differ by encoding; the label-only channel has no encoding dependence. Shared probability scales and numeric cell labels permit direct comparison."
    uncertainty: "These are exact channel declarations with no sampling intervals; both separate marginals remain uniform."
    scope: "The information lies in the paired relation. These finite matrices are not observed eye movements or measured biological boundary channels."
  - figure: "boundary_gaze_paths"
    title: "Spatial gaze and nonspatial questions share one budget."
    task: "The preselected example uses the first scene, {{MODEL_BOUNDARY_EXCLUDED_ENCODINGS}}, and the first paired replicate."
    reading: "Upper panels show the first {{GAZE_TRAJECTORY_STEPS}} visual samples; lower panels retain all {{BOUNDARY_STEPS}} decisions, including contingency questions. Straight lines connect displayed sites across intervening questions."
    uncertainty: "This is an illustrative trajectory, selected by its input indices rather than its result; it carries no inferential interval."
    scope: "A question is not a spatial fixation. Artwork: {{ARTWORK_CREDIT}}; registration and overlays are authored displays."
  - figure: "boundary_gaze_allocation"
    title: "Information, prediction and expenditure are separate outcomes."
    task: "Policies allocate a common decision budget between scene samples and encoding questions."
    reading: "Points are equal-fixed-stratum means of question allocation, current-scene excess predictive loss and declared cost; vertical segments show pooled whole-episode interquartile ranges. Each panel retains its own units."
    uncertainty: "Segments describe whole-unit spread across the fixed scene/encoding mixture, including between-cell variation; they are not confidence intervals. Repeated decisions are not independent samples."
    scope: "An informative question can reduce scene sampling even when reference transfer improves. Expenditure and encoding knowledge are not interchangeable with predictive success or realization."
  - figure: "boundary_gaze_convergence"
    title: "More independent agents reduce Monte Carlo error, not structural ambiguity."
    task: "The preselected {{MODEL_BOUNDARY_EXCLUDED_ENCODINGS}} case is evaluated at the declared nested replicate prefixes."
    reading: "Points show paired anchored-risk contrasts averaged over {{BOUNDARY_SCENES}} fixed scene strata, alongside their Monte Carlo standard errors. Horizontal axes are logarithmic."
    uncertainty: "Prefixes share earlier units and are correlated; repeated decisions do not enlarge the independent N. Point estimates need not change monotonically."
    scope: "The full convergence record retains both endpoints and all declared contexts. Enlarging N cannot identify observation-equivalent encodings."
  - figure: "boundary_structure"
    title: "Marginal association and conditional independence answer different questions."
    task: "This separate pinned Realizing Emptiness Gaussian fixture compares the known precision matrix with full marginal correlations."
    reading: "The matrices describe the same Gaussian law. Exhaustive marginal-threshold intervals fail exact blanket recovery, while inversion of the full covariance recovers precision."
    uncertainty: "Entries are deterministic finite mathematical values, not estimated biological correlations or confidence intervals."
    scope: "Gaussian variables and QRF bit labels name different objects. This comparator is not another participant or observation in the scene/encoding experiment."
  - figure: "attention_policies"
    title: "Precision profiles alter policy mass in a fixed-process comparator."
    task: "Positive and negative attention profiles are exogenously assigned rather than learned from gratitude rehearsal."
    reading: "Circles and squares identify profiles. Values aggregate policy probability over the declared positive, negative and neutral sites; all masses, including small negative-site values, are labeled."
    uncertainty: "Gray connectors compare profiles and are not uncertainty intervals."
    scope: "Native matched-model qualification is separate. These policy probabilities are neither measured gaze nor evidence of learned transfer."
  - figure: "sensitivity"
    title: "A finite parameter grid tests dependence on declared choices."
    task: "Each prior-concentration and recall-precision cell is independently admitted from a modified GNN declaration."
    reading: "Colors show positive-minus-random contrasts in endpoint changes; the panels retain their own units and zero-centered scales."
    uncertainty: "Cells share seeds and are conditional fixed-grid comparisons, not independent replications or confidence regions."
    scope: "The grid makes model dependence visible. It does not estimate uncertainty over unexamined parameters or establish human robustness."
  - figure: "statistical_calibration"
    title: "Distribution shape limits the interpretation of nominal confidence."
    task: "Known-answer fixtures test coverage, interval availability and mean-zero rejection using the same generated samples for every method."
    reading: "The coverage panel spans {{CALIBRATION_FIXTURES}} fixtures and uses a data-derived detail axis; the rejection panel separates null distributions from the positive-shift control. Bootstrap t availability is displayed for every fixture. The Bernoulli annotation distinguishes exact availability, observed availability and coverage conditional on an available interval."
    uncertainty: "Whiskers are exact binomial {{POINTWISE_CONFIDENCE_PERCENT}}% intervals over independent experiments; unavailable intervals count as noncoverage. Reference lines are {{POINTWISE_CONFIDENCE}} coverage and {{POINTWISE_ALPHA}} rejection."
    scope: "Centered exponential and Bernoulli differences violate sign symmetry despite zero means. The exact Bernoulli calculation benchmarks availability under the strict zero-variance failure rule, not coverage. The benchmarks are not retuned to make a method pass."
