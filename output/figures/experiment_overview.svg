   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142e3a" x="20.95416" y="58.011929" transform="rotate(-0 20.95416 58.011929)">a  Recall: does selected replay improve prediction?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 87.137625)">Positive vs random</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 100.295437)">replay; same exposure</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 114.470437)">and matched replay dose.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 86.120437)">1024 paired units/world;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 101.312625)">frozen Brier and</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 114.470437)">optimism tests.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 86.120437)">Value-only control:</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 100.295437)">unchanged beliefs and</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 114.470437)">predictive losses.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142e3a" x="20.95416" y="151.006668" transform="rotate(-0 20.95416 151.006668)">b  Absence: no event, no record, or a different value?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 179.115177)">Functioning detector vs</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 193.290177)">missing record; actual</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 208.482364)">vs reference cost.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 179.115177)">Posterior change in</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 193.290177)">bits; separate</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 208.482364)">counterfactual cost</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 222.657364)">value.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 180.132364)">No record adds no</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 194.307364)">evidence under the</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 208.482364)">declared rule.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142e3a" x="20.95416" y="244.001408" transform="rotate(-0 20.95416 244.001408)">c  Practice: does chosen activity provide usable access?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 273.127103)">Value and cost affect</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 286.284916)">activity; 24 calibration</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 301.477103)">observations.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 272.591439)">512 new outcomes/window;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 286.284916)">512 paired</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 301.064486)">units/context.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 273.127103)">Sham or blocked access:</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 286.284916)">activity can cost</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 300.459916)">without revising.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142e3a" x="20.95416" y="336.996147" transform="rotate(-0 20.95416 336.996147)">d  Transfer: what follows from a learned likelihood?</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 365.586178)">Freeze learned channels;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 379.279655)">compare likelihood and</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 393.454655)">readout bridges.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 365.104655)">5120 complete paired</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 379.279655)">agents; attention and</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 393.454655)">scene loss separately.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 366.121842)">A favorable attention</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 379.279655)">shift need not improve</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 393.454655)">prediction.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142e3a" x="20.95416" y="429.990886" transform="rotate(-0 20.95416 429.990886)">e  Scene inquiry: access or the sampling policy?</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 458.099394)">Restricted vs open;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 472.274394)">utility vs inquiry vs</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 486.930918)">uniform; 48 decisions.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 458.099394)">512 paired</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 472.755918)">units/context; scene</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 487.466582)">loss and movement cost.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 458.099394)">Already-open comparators</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 472.274394)">test an inquiry-specific</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b74343" transform="translate(325.14264 487.466582)">increment.</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142e3a" x="20.95416" y="522.985625" transform="rotate(-0 20.95416 522.985625)">f  Boundary inquiry: can the inferred frame be used?</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 551.094133)">Spatial vs action-</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 565.269133)">response queries; one</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #596579" transform="translate(20.95416 579.444133)">24-decision budget.</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 551.094133)">512 paired units/cell;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 565.269133)">encoding and reference</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #007c83" transform="translate(173.0484 580.461321)">losses.</text>
   </g>
   <g id="text_27">
